[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-arena"
version = "0.1.0"
description = "AgentArena -- a spectatable arena for LLM-powered agents"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10"]

[tool.setuptools]
packages = ["games"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
