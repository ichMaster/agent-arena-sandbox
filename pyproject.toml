[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-arena"
version = "0.0.0"
description = "AgentArena — LLM agents play games over a WebSocket protocol, watched live."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.19",
    "websockets>=12.0",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "anthropic>=0.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.8",
    "httpx>=0.26",
    "types-PyYAML",
]

[tool.setuptools]
packages = ["games", "server", "agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
strict = true
