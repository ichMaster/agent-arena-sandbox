[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-arena"
version = "0.0.0"
description = "AgentArena -- a spectatable arena for LLM-powered agents to compete at turn-based board games."
requires-python = ">=3.11"
dependencies = [
    # Async SQLite persistence (server/). All durable state lives in SQLite behind the Repository.
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    # Game Server: FastAPI app + lobby REST (and, later, the WebSocket hub).
    "fastapi>=0.110",
    # Game Server: the ASGI server the README's `uvicorn server.main:app` actually needs -- plain
    # fastapi does not pull this in transitively.
    "uvicorn>=0.30",
    # Agent Client: the Anthropic SDK behind the LLMClient seam (Haiku). Always mocked in tests.
    "anthropic>=0.100",
    # Agent Client: persona profiles are YAML (AgentProfile.load_from_yaml).
    "pyyaml>=6",
    # Agent Client CLI: REST join, the WS event loop, and .env key loading (§9).
    "httpx>=0.27",
    "websockets>=12",
    "python-dotenv>=1",
]

[project.optional-dependencies]
# Local dev toolchain (installed into a gitignored .venv/); the LLM is always mocked in tests.
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",  # FastAPI TestClient
    "mypy>=1.8",
    "types-PyYAML",  # strict typing for yaml.safe_load
]

[tool.setuptools]
# Only these are installable Python packages -- without this, setuptools' flat-layout
# auto-discovery trips over the sibling asset/doc dirs (web/, profiles/, scripts/, spec/, tests/)
# and refuses to build.
packages = ["games", "server", "agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the repo root on sys.path so tests can `import games` / `import server` / `import agent`
# without an editable install.
pythonpath = ["."]
# Async tests/fixtures (SQLAlchemy async) run without per-test decorators.
asyncio_mode = "auto"

[tool.mypy]
# Strict typing is a project non-negotiable. One source of truth lives here.
strict = true
files = ["games", "server", "agent"]
warn_unused_configs = true
