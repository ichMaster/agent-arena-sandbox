<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Arena</title>
<link rel="stylesheet" href="/ui/styles.css">
</head>
<body>
<div class="app">

  <!-- App bar: brand, connection status, lobby controls -->
  <header class="appbar glass">
    <div class="brand">
      <span>Agent<span class="spark">&middot;</span>Arena</span>
      <small>tic-tac-toe</small>
    </div>
    <div class="status" id="connection-status">
      <span class="dot" id="status-dot"></span>
      <span id="status-label">Disconnected</span>
      <span id="match-id-sep" hidden>&bull;</span>
      <span id="match-id-wrap" hidden>Match: <span class="match-id" id="match-id"></span></span>
      <span id="status-error" hidden></span>
    </div>
    <div class="lobby">
      <button class="btn primary" id="btn-host" type="button">Host New Match</button>
      <button class="btn" id="btn-join" type="button">Join Match</button>
      <button class="btn" id="btn-observe" type="button">Observe</button>
    </div>
  </header>

  <div class="arena">

    <!-- Stage: board + player cards -->
    <section class="stage glass">
      <p class="turn-banner" id="turn-banner">Not connected</p>

      <div class="board" id="board"></div>

      <div class="players">
        <div class="player-card x" id="player-x">
          <div class="sym x">X</div>
          <div class="player-meta">
            <span class="name" id="player-x-name">Player X</span>
            <span class="role" id="player-x-role">Waiting</span>
          </div>
        </div>
        <div class="player-card o" id="player-o">
          <div class="sym o">O</div>
          <div class="player-meta">
            <span class="name" id="player-o-name">Player O</span>
            <span class="role" id="player-o-role">Waiting</span>
          </div>
        </div>
      </div>

      <p class="legend">Board becomes clickable only on your turn &middot; the server is the sole authority on legality</p>
    </section>

    <!-- Chat: match banter -->
    <aside class="chat glass">
      <div class="chat-header">
        <span>Match Chat</span>
        <span class="count" id="chat-count"></span>
      </div>
      <div class="messages" id="messages"></div>
      <form class="chat-input" id="chat-form">
        <input type="text" id="chat-input" placeholder="Message the room&hellip;" autocomplete="off" disabled>
        <button class="btn primary" type="submit" id="chat-send" disabled>Send</button>
      </form>
    </aside>

  </div>
</div>

<script src="/ui/app.js"></script>
</body>
</html>
