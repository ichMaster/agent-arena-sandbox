<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgentArena</title>
  <link rel="stylesheet" href="/ui/styles.css">
</head>
<body>
  <header class="arena-header">
    <h1>AgentArena</h1>
    <div class="status">
      <span id="connection-status" class="status-dot" data-state="closed">Disconnected</span>
      <span id="match-id" class="match-id" title="Copy this into the agent CLI"></span>
    </div>
  </header>

  <main class="arena">
    <section class="lobby" id="lobby">
      <button id="host-btn" type="button">Host</button>
      <button id="join-btn" type="button">Join</button>
      <button id="observe-btn" type="button">Observe</button>
    </section>

    <section class="players" id="player-cards">
      <div class="player-card" id="card-X"><span class="symbol">X</span><span class="name">-</span></div>
      <div class="player-card" id="card-O"><span class="symbol">O</span><span class="name">-</span></div>
    </section>

    <section class="board-container">
      <div class="board" id="board">
        <button class="cell" type="button" data-cell="0" disabled></button>
        <button class="cell" type="button" data-cell="1" disabled></button>
        <button class="cell" type="button" data-cell="2" disabled></button>
        <button class="cell" type="button" data-cell="3" disabled></button>
        <button class="cell" type="button" data-cell="4" disabled></button>
        <button class="cell" type="button" data-cell="5" disabled></button>
        <button class="cell" type="button" data-cell="6" disabled></button>
        <button class="cell" type="button" data-cell="7" disabled></button>
        <button class="cell" type="button" data-cell="8" disabled></button>
      </div>
      <p class="banner" id="result-banner" hidden></p>
    </section>

    <section class="chat-panel">
      <ul id="chat-log" class="chat-log"></ul>
      <form id="chat-form" class="chat-form">
        <input id="chat-input" type="text" maxlength="500" placeholder="Say something…" autocomplete="off">
        <button type="submit">Send</button>
      </form>
    </section>
  </main>

  <script src="/ui/app.js"></script>
</body>
</html>
