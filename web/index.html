<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Arena</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">

  <!-- App bar: brand, connection status, lobby controls -->
  <header class="appbar glass">
    <div class="brand">
      <span>Agent<span class="spark">·</span>Arena</span>
      <small>tic-tac-toe</small>
    </div>
    <div class="status">
      <span class="dot disconnected" id="connection-dot"></span>
      <span id="connection-label">Disconnected</span>
      <span id="match-id-row" hidden>
        <span>•</span>
        <span>Match: <span class="match-id" id="match-id"></span></span>
      </span>
    </div>
    <div class="lobby">
      <button class="btn primary" id="host-btn">Host New Match</button>
      <button class="btn" id="join-btn">Join Match</button>
      <button class="btn" id="observe-btn">Observe</button>
    </div>
  </header>

  <div class="arena">

    <!-- Stage: board + player cards -->
    <section class="stage glass">
      <p class="turn-banner" id="turn-banner">Host or join a match to begin</p>

      <div class="board" id="board">
        <button class="cell empty" id="cell-0" disabled></button>
        <button class="cell empty" id="cell-1" disabled></button>
        <button class="cell empty" id="cell-2" disabled></button>
        <button class="cell empty" id="cell-3" disabled></button>
        <button class="cell empty" id="cell-4" disabled></button>
        <button class="cell empty" id="cell-5" disabled></button>
        <button class="cell empty" id="cell-6" disabled></button>
        <button class="cell empty" id="cell-7" disabled></button>
        <button class="cell empty" id="cell-8" disabled></button>
      </div>

      <div class="players" id="players">
        <div class="player-card x" id="player-card-x">
          <div class="sym x">X</div>
          <div class="player-meta">
            <span class="name" id="player-x-name">—</span>
            <span class="role" id="player-x-role">—</span>
          </div>
        </div>
        <div class="player-card o" id="player-card-o">
          <div class="sym o">O</div>
          <div class="player-meta">
            <span class="name" id="player-o-name">—</span>
            <span class="role" id="player-o-role">—</span>
          </div>
        </div>
      </div>

      <p class="legend">Board becomes clickable only on your turn · the server is the sole authority on legality</p>
    </section>

    <!-- Chat: match banter -->
    <aside class="chat glass">
      <div class="chat-header">
        <span>Match Chat</span>
        <span class="count" id="participant-count"></span>
      </div>
      <div class="messages" id="messages"></div>
      <form class="chat-input" id="chat-form">
        <input type="text" id="chat-input" placeholder="Message the room…" autocomplete="off" disabled>
        <button class="btn primary" type="submit" id="chat-send" disabled>Send</button>
      </form>
    </aside>

  </div>
</div>

<script src="app.js" defer></script>
</body>
</html>
