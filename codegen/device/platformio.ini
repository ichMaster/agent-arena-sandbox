; M5-013 — one tree, two boards.
;
; Both environments compile the *same* shared/ directory. Not a copy each: the whole
; reason device/shared/ exists is that the frame parser is the one genuinely fiddly
; piece of firmware, and two copies would mean two places for it to drift. The build
; filters below name shared/ from both envs, and a test asserts no file under core2/
; or stickc/ shadows one of its names.
;
; frame_test.cpp is excluded from firmware builds. It carries its own main() and is
; compiled by device/shared/run_tests.sh on the host, where it belongs.

[platformio]
src_dir = .
default_envs = core2, stickc

[env]
platform = espressif32@^6.5.0
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
build_unflags = -std=gnu++11
lib_deps =
    ; One API across both boards, and it absorbs two real footguns: the Core2's
    ; AXP192/AXP2101 split between revisions, and the StickC Plus2's requirement to
    ; hold GPIO4 high to stay powered on. Meeting either by hand costs an afternoon.
    m5stack/M5Unified@^0.1.16
    ; Roughly half the RAM of Bluedroid, which matters more on the StickC.
    h2zero/NimBLE-Arduino@^1.4.1
check_skip_packages = yes

[env:core2]
board = m5stack-core2
build_src_filter = +<shared/> -<shared/frame_test.cpp> +<core2/>
build_flags =
    ${env.build_flags}
    -DCODEGEN_BOARD_CORE2=1

; espressif32@6.5.0 ships no StickC **Plus2** definition -- only `m5stick-c`, which is
; the original: ESP32-PICO-D4 with 4 MB of flash. The Plus2 is ESP32-PICO-V3-02 with
; 8 MB, so the stock board would build a firmware that fits an image the real hardware
; has four times the room for, and would size its partitions to match.
;
; Overriding the flash geometry on top of the closest board is the smaller lie than
; carrying a whole custom board JSON for two numbers. Revisit if a Plus2 definition
; lands upstream.
[env:stickc]
board = m5stick-c
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = default_8MB.csv
build_src_filter = +<shared/> -<shared/frame_test.cpp> +<stickc/>
build_flags =
    ${env.build_flags}
    -DCODEGEN_BOARD_STICKC=1
